<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GiftTrove</title>
    <!-- Preconnect to asset origins so the splash & gifts paint faster -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://nft.fragment.com" crossorigin />
    <link rel="preconnect" href="https://i.ibb.co" crossorigin />
    <link rel="preconnect" href="https://gift-trove-backend.onrender.com" crossorigin />
    <!-- Apply the user's last-chosen theme to <html> synchronously, before any
         paint happens, so the static background below (and anything else
         keyed off [data-theme]) matches their actual preference immediately
         instead of always assuming light mode. -->
    <script>
      try {
        // Mirrors App.jsx's exact theme-resolution logic (including the one-time
        // gt_theme_v2 migration that forces existing users back to light once)
        // so this synchronous pre-paint check never disagrees with what React
        // decides a moment later.
        if (localStorage.getItem("gt_theme_v2") && localStorage.getItem("gt_theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    </script>
    <!-- Critical layout + background CSS, inline so it applies on the very
         first paint — before Tailwind's CDN script and React's own injected
         <style> tag have loaded. Without the layout rules, the page briefly
         renders at its natural (tiny, top-left) size until JS finishes
         mounting, which looks like the app "jumping" into place. The
         background matches the app's actual default exactly (flat colour +
         the same subtle top radial glow used once React mounts, for both
         light and dark) so there's no flash of a different background and
         the glow is visible immediately instead of popping in late. -->
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        min-height: 100vh; overflow: hidden;
        background-color: #f2f2f7;
        background-image: radial-gradient(130% 140% at 50% -15%, rgba(51,65,85,0.92) 0%, rgba(51,65,85,0.68) 30%, rgba(51,65,85,0.40) 55%, rgba(51,65,85,0.18) 75%, #f2f2f7 95%);
        background-attachment: fixed;
      }
      html[data-theme="dark"] body {
        background-color: #000000;
        background-image: radial-gradient(120% 120% at 50% -20%, rgba(10, 132, 255, 0.15) 0%, #000000 100%);
      }
      #root { min-height: 100vh; }
    </style>
    <!-- This loads the Tailwind engine instantly via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- This requires the standard Telegram SDK script for Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body class="text-white selection:bg-emerald-500/30 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
