<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GiftTrove</title>
    <!-- Telegram Mini App SDK (required). -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      Keep the body dark navy (#0f172a) in ALL themes.
      This is intentional — it's the outer shell visible through the
      translucent top-nav backdrop-filter, giving light mode its fancy
      dark top edge. The app's content areas define their own backgrounds
      via --bg-base (#f2f2f7 light / #000 dark) and are NOT affected.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gt_theme") || "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; padding: 0; background: #0f172a; }
      body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
