<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GiftTrove</title>
    <!-- Telegram Mini App SDK (required). -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Anti-flash: paint the correct background before React mounts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gt_theme") || "light";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.background = t === "dark" ? "#000000" : "#f2f2f7";
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; padding: 0; }
      body { background: transparent; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
